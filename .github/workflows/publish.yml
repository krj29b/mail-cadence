name: CI & Publish to PyPI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  release:
    types: [published]
  schedule:
    # Weekly run: catches new dependency releases and new advisories without a commit.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

defaults:
  run:
    shell: bash

jobs:
  quality-gates:
    name: Lint, types, dead code, complexity, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff, ruff format, mypy
        run: make lint

      - name: Vulture
        run: make dead-code

      - name: Radon report and xenon gate (nothing worse than B)
        run: make complexity

      - name: pip-audit
        run: make audit

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Pytest with coverage
        run: python -m pytest --cov=mail_cadence --cov-report=term-missing --cov-fail-under=90

      - name: Coverage summary
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  lowest-dependencies:
    name: Tests with lowest declared dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install the minimum versions allowed by pyproject.toml
        run: |
          uv venv --python "$(which python)" .venv-lowest
          uv pip install -p .venv-lowest --resolution lowest-direct -e ".[dev]"
          uv pip list -p .venv-lowest

      - name: Pytest
        run: .venv-lowest/bin/python -m pytest

  assets:
    name: Panel assets match a fresh build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Rebuild assets from the pinned lockfile
        run: make assets

      - name: Committed assets must equal the fresh build
        run: |
          changes=$(git status --porcelain -- src/mail_cadence/web_static)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::src/mail_cadence/web_static is out of date: run 'make assets' and commit the result"
            exit 1
          fi

  build:
    name: Build distributions
    needs: [quality-gates, tests, lowest-dependencies, assets]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version from pyproject.toml
        id: version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pyproject.toml version: $version"

      - name: Release tag must match pyproject.toml version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match pyproject.toml version '$VERSION'"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  smoke-test:
    name: Smoke test ${{ matrix.dist }} (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        dist: [wheel, sdist]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Install the built package into a clean virtual environment
        env:
          DIST: ${{ matrix.dist }}
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          if [ "$RUNNER_OS" = "Windows" ]; then py="$RUNNER_TEMP/smoke/Scripts/python"; else py="$RUNNER_TEMP/smoke/bin/python"; fi
          if [ "$DIST" = "wheel" ]; then pkg=$(ls dist/*.whl); else pkg=$(ls dist/*.tar.gz); fi
          "$py" -m pip install "$pkg" httpx
          echo "SMOKE_PY=$py" >> "$GITHUB_ENV"

      - name: Run the smoke test outside the source tree
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          "$SMOKE_PY" -I "$GITHUB_WORKSPACE/scripts/smoke_test_wheel.py" \
            --repo "$GITHUB_WORKSPACE" --expect-version "$VERSION"

  publish-testpypi:
    name: Publish to TestPyPI (pre-releases)
    if: github.event_name == 'release' && github.event.release.prerelease
    needs: smoke-test
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mail-cadence
    permissions:
      id-token: write  # Trusted Publishing (OIDC); also signs PEP 740 attestations
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: smoke-test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mail-cadence
    permissions:
      id-token: write  # Trusted Publishing (OIDC); also signs PEP 740 attestations
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

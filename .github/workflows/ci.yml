name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    # Weekly run: catches new dependency releases and new advisories without a commit.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

defaults:
  run:
    shell: bash

jobs:
  quality-gates:
    name: Lint, types, dead code, complexity, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff, ruff format, mypy
        run: make lint

      - name: Vulture
        run: make dead-code

      - name: Radon report and xenon gate (nothing worse than B)
        run: make complexity

      - name: pip-audit
        run: make audit

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Pytest with coverage
        run: python -m pytest --cov=mail_cadence --cov-report=term-missing --cov-fail-under=90

      - name: Coverage summary
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  lowest-dependencies:
    name: Tests with lowest declared dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: false

      - name: Install the minimum versions allowed by pyproject.toml
        run: |
          uv venv --python "$(which python)" .venv-lowest
          uv pip install -p .venv-lowest --resolution lowest-direct -e ".[dev]"
          uv pip list -p .venv-lowest

      # The oldest allowed fastapi/typer use APIs that their newer transitive
      # dependencies (anyio, click) deprecate; report those instead of failing.
      - name: Pytest
        run: .venv-lowest/bin/python -m pytest -W default::DeprecationWarning

  # The race and failure tests of ADR 0001, 50 times per OS (2 shards x 25 runs).
  # Pull requests and pushes run each of them once per OS and Python version in
  # `tests`; the repetitions run only in the weekly run and on demand.
  race-stress:
    name: Race stress (${{ matrix.os }}, shard ${{ matrix.shard }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: 25 runs of the race and failure tests
        env:
          LABEL: ${{ matrix.os }} shard ${{ matrix.shard }}
        run: python scripts/stress_races.py --iterations 25 --label "$LABEL"

  assets:
    name: Panel assets match a fresh build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Rebuild assets from the pinned lockfile
        run: make assets

      - name: Committed assets must equal the fresh build
        run: |
          changes=$(git status --porcelain -- src/mail_cadence/web_static)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::src/mail_cadence/web_static is out of date: run 'make assets' and commit the result"
            exit 1
          fi

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: false

      - name: Audit .github/workflows
        env:
          # Read-only token for the online audits (impostor commits, known-vulnerable actions).
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.31.1 --format github .github/workflows

  build:
    name: Build & smoke test
    needs: [quality-gates, tests, lowest-dependencies, assets, zizmor]
    uses: ./.github/workflows/_build.yml

name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    # Weekly run: catches new dependency releases and new advisories without a commit.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

defaults:
  run:
    shell: bash

jobs:
  quality-gates:
    name: Lint, types, dead code, complexity, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff, ruff format, mypy
        run: make lint

      - name: Vulture
        run: make dead-code

      - name: Radon report and xenon gate (nothing worse than B)
        run: make complexity

      - name: pip-audit
        run: make audit

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Pytest with coverage
        run: python -m pytest --cov=mail_cadence --cov-report=term-missing --cov-fail-under=90

      - name: Coverage summary
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  lowest-dependencies:
    name: Tests with lowest declared dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: false

      - name: Install the minimum versions allowed by pyproject.toml
        run: |
          uv venv --python "$(which python)" .venv-lowest
          uv pip install -p .venv-lowest --resolution lowest-direct -e ".[dev]"
          uv pip list -p .venv-lowest

      - name: Pytest
        run: .venv-lowest/bin/python -m pytest

  assets:
    name: Panel assets match a fresh build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Rebuild assets from the pinned lockfile
        run: make assets

      - name: Committed assets must equal the fresh build
        run: |
          changes=$(git status --porcelain -- src/mail_cadence/web_static)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::src/mail_cadence/web_static is out of date: run 'make assets' and commit the result"
            exit 1
          fi

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: false

      - name: Audit .github/workflows
        env:
          # Read-only token for the online audits (impostor commits, known-vulnerable actions).
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.31.1 --format github .github/workflows

  build:
    name: Build & smoke test
    needs: [quality-gates, tests, lowest-dependencies, assets, zizmor]
    uses: ./.github/workflows/_build.yml

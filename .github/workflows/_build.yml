# Build the distributions and smoke-test them. Called by ci.yml and publish.yml.
# No caches here: release artifacts are built only from pinned, hash-checked tools.
name: Build & smoke test

on:
  workflow_call:
    inputs:
      release-tag:
        description: "Release tag that must match the pyproject.toml version (empty: no check)"
        type: string
        default: ""
    outputs:
      version:
        description: "Version from pyproject.toml"
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Read version from pyproject.toml
        id: version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pyproject.toml version: $version"

      - name: Release tag must match pyproject.toml version
        if: inputs.release-tag != ''
        env:
          TAG: ${{ inputs.release-tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match pyproject.toml version '$VERSION'"
            exit 1
          fi

      - name: Install pinned, hash-checked build tools
        run: python -m pip install --require-hashes --only-binary ":all:" -r .github/requirements/release.txt

      - name: Build sdist and wheel
        # --no-isolation: build with the pinned hatchling above, not whatever PyPI serves now.
        run: |
          python -m build --no-isolation
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  smoke-test:
    name: Smoke test ${{ matrix.dist }} (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        dist: [wheel, sdist]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Install the built package into a clean virtual environment
        env:
          DIST: ${{ matrix.dist }}
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          if [ "$RUNNER_OS" = "Windows" ]; then py="$RUNNER_TEMP/smoke/Scripts/python"; else py="$RUNNER_TEMP/smoke/bin/python"; fi
          if [ "$DIST" = "wheel" ]; then pkg=$(ls dist/*.whl); else pkg=$(ls dist/*.tar.gz); fi
          "$py" -m pip install "$pkg" httpx
          echo "SMOKE_PY=$py" >> "$GITHUB_ENV"

      - name: Run the smoke test outside the source tree
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          "$SMOKE_PY" -I "$GITHUB_WORKSPACE/scripts/smoke_test_wheel.py" \
            --repo "$GITHUB_WORKSPACE" --expect-version "$VERSION"

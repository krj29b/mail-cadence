<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MailCadence Admin{% endblock %}</title>

  <!-- All assets are served by the app (no CDNs) so the panel works under a strict
       Content-Security-Policy. Rebuild them with `make assets`. -->
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false}'>
  <script src="/static/theme.js?v={{ asset_version }}"></script>
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
  <script src="/static/vendor/htmx.min.js?v={{ asset_version }}" defer></script>
  <script src="/static/icons.js?v={{ asset_version }}" defer></script>
  <script src="/static/app.js?v={{ asset_version }}" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body class="h-full bg-slate-950 text-slate-100 font-sans antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
  <div class="flex h-screen overflow-hidden">
    <!-- Fixed Left Sidebar -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between shrink-0 h-screen sticky top-0">
      <div class="flex flex-col flex-1 min-h-0">
        <!-- Brand Header -->
        <div class="p-5 border-b border-slate-800/80 flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 shadow-inner">
              <i data-lucide="mail-check" class="w-4 h-4"></i>
            </div>
            <span class="font-semibold tracking-tight text-slate-50 text-base">MailCadence</span>
          </div>
          <span class="font-mono text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-2 py-0.5 rounded-full">v{{ asset_version }}</span>
        </div>

        <!-- Navigation Links -->
        <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
          <a href="/" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-all duration-150 {% if active_page == 'dashboard' %}bg-slate-800/80 text-slate-50 border-l-2 border-indigo-500 font-medium shadow-sm{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800/40 border-l-2 border-transparent{% endif %}">
            <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
            <span>Dashboard</span>
          </a>
          <a href="/tasks" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-all duration-150 {% if active_page == 'tasks' %}bg-slate-800/80 text-slate-50 border-l-2 border-indigo-500 font-medium shadow-sm{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800/40 border-l-2 border-transparent{% endif %}">
            <i data-lucide="mail" class="w-4 h-4"></i>
            <span>Tasks</span>
          </a>
          <a href="/executions" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-all duration-150 {% if active_page == 'executions' %}bg-slate-800/80 text-slate-50 border-l-2 border-indigo-500 font-medium shadow-sm{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800/40 border-l-2 border-transparent{% endif %}">
            <i data-lucide="list-checks" class="w-4 h-4"></i>
            <span>Executions</span>
          </a>
          <a href="/schedules" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-all duration-150 {% if active_page == 'schedules' %}bg-slate-800/80 text-slate-50 border-l-2 border-indigo-500 font-medium shadow-sm{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800/40 border-l-2 border-transparent{% endif %}">
            <i data-lucide="calendar-clock" class="w-4 h-4"></i>
            <span>Schedules</span>
          </a>
          <a href="/settings" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-all duration-150 {% if active_page == 'settings' %}bg-slate-800/80 text-slate-50 border-l-2 border-indigo-500 font-medium shadow-sm{% else %}text-slate-400 hover:text-slate-200 hover:bg-slate-800/40 border-l-2 border-transparent{% endif %}">
            <i data-lucide="sliders" class="w-4 h-4"></i>
            <span>Settings</span>
          </a>
        </nav>
      </div>

      <!-- Engine Status & Theme Footer -->
      <div class="p-4 border-t border-slate-800/80 bg-slate-900/50 space-y-2">
        <button id="theme-toggle" data-on-click="toggle-theme" type="button" aria-label="Toggle color theme" aria-pressed="false" class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-md bg-slate-950/60 hover:bg-slate-800/60 border border-slate-800/60 text-xs text-slate-300 transition-colors">
          <span class="flex items-center gap-2">
            <i data-lucide="sun" class="w-3.5 h-3.5 text-amber-400 theme-icon-sun"></i>
            <i data-lucide="moon" class="w-3.5 h-3.5 text-indigo-400 theme-icon-moon hidden"></i>
            <span id="theme-toggle-label" class="font-medium">Theme: System</span>
          </span>
          <span class="text-[10px] uppercase font-mono text-slate-500" id="theme-toggle-state">Auto</span>
        </button>

        <div class="flex items-center gap-2.5 px-2 py-1.5 rounded-md bg-slate-950/60 border border-slate-800/60">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-400"></span>
          </span>
          <span class="text-xs font-mono text-slate-300">SQLite WAL Engine Ready</span>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 min-w-0 bg-slate-950 text-slate-100 overflow-y-auto">
      <div class="max-w-7xl mx-auto px-6 py-8 space-y-6">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>

</body>
</html>

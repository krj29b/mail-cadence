[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mail-cadence"
version = "0.9.5"
description = "Asynchronous SQLite-backed bulk email dispatch and reporting engine with XML import/export support"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "krj29b" }]
keywords = [
    "email",
    "smtp",
    "aiosmtplib",
    "scheduler",
    "rate-limiter",
    "sqlite",
    "xml",
    "fastapi",
    "htmx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=3.0.1",
    "defusedxml>=0.7.1",
    "fastapi>=0.115.0",
    "jinja2>=3.1.4",
    "lxml>=5.2.2",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pydantic-xml[lxml]>=2.11.0",
    "python-multipart>=0.0.9",
    "typer>=0.13.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "uvicorn>=0.30.0",
]

[project.urls]
Homepage = "https://github.com/krj29b/mail-cadence"
Repository = "https://github.com/krj29b/mail-cadence"
Documentation = "https://github.com/krj29b/mail-cadence/blob/master/docs/README.md"
Issues = "https://github.com/krj29b/mail-cadence/issues"

[project.optional-dependencies]
dev = [
    # Starlette >= 1.x TestClient uses httpx2 (plain httpx is deprecated there);
    # older Starlette, as installed by the lowest-versions job, still needs httpx.
    "httpx>=0.27.0",
    "httpx2>=2.0.0",
    "hypothesis>=6.100.0",
    "mypy>=1.11.0",
    "pip-audit>=2.7.3",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0.0",
    "radon>=6.0.1",
    "ruff>=0.5.5",
    "vulture>=2.11",
    "xenon>=0.9.3",
]

[project.scripts]
mail-cadence = "mail_cadence.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_cadence"]
artifacts = [
    "src/mail_cadence/py.typed",
    "src/mail_cadence/templates/*.j2",
    "src/mail_cadence/web_templates/*.html",
    "src/mail_cadence/web_templates/*.css",
    "src/mail_cadence/web_static/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/AGENTS.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async
    "C90",   # McCabe cyclomatic complexity
    "PLR",   # Pylint Refactor
    "PERF",  # Perflint
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "RUF",   # Ruff-specific rules
    "S",     # flake8-bandit
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 10
max-statements = 40

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "PLR0912", "PLR0915", "C901", "PT011"]
"src/mail_cadence/web.py" = ["B008"]
"src/mail_cadence/cli.py" = ["PLR0913", "PLR0917"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 80
ignore_decorators = [
    "@app.*",
    "@*.command*",
    "@*.callback*",
    "@*.get*",
    "@*.post*",
    "@*.put*",
    "@*.delete*",
    "@field_validator*",
    "@model_validator*",
]
ignore_names = [
    "row_factory",
    "model_config",
    "partial_tasks",
    "skipped_tasks",
    "total_duration_ms",
]

# fail2ban filter for the web panel login limit.
# Matches the warning logged by mail_cadence.web when a client gets blocked (429), e.g.:
#   ... [WARNING] mail_cadence.web: Too many failed admin logins from 203.0.113.7: blocked for up to 900s
[Definition]
failregex = Too many failed admin logins from <HOST>:
ignoreregex =
journalmatch = _SYSTEMD_UNIT=mail-cadence-web.service

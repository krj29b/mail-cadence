# nginx reverse proxy for the web panel (mail-cadence-web.service on 127.0.0.1:8000).
# Put it in /etc/nginx/sites-available/, adjust server_name and certificate paths.

server {
    listen 80;
    listen [::]:80;
    server_name mail-cadence.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail-cadence.example.com;

    ssl_certificate     /etc/letsencrypt/live/mail-cadence.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail-cadence.example.com/privkey.pem;

    # Basic Auth sends the password with every request: HTTPS only, remembered by browsers.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        # Required: the same-origin check compares Origin with Host (403 otherwise).
        proxy_set_header Host $host;
        # Required: real client IP for the login limit (uvicorn trusts it from 127.0.0.1).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
